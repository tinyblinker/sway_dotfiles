# ---- General ----
mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
# ---- External controller / dashboard ----
external-controller: 127.0.0.1:9097
secret: ENC[AES256_GCM,data:+djmQrH9w1h4T7pr,iv:hTbKDXieaSj23EKJa4KxDqRnCSPQkFWWJDcrvgTfGAI=,tag:jbHKdKxo6qASw/FxHxAhJg==,type:str]
external-controller-cors:
    allow-private-network: true
    allow-origins:
        - https://yacd.metacubex.one
        - https://metacubex.github.io
        - https://board.zash.run.place
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
# GeoIP database mirror
geox-url:
    mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
# Profile
profile:
    store-selected: true
    store-fake-ip: true
# ---- Sniffer ----
sniffer:
    enable: true
    override-destination: true
    force-dns-mapping: true
    parse-pure-ip: true
    sniff:
        HTTP:
            ports:
                - 80
                - 8080-8880
            override-destination: true
        TLS:
            ports:
                - 443
                - 8443
            override-destination: true
        QUIC:
            ports:
                - 443
                - 8443
            override-destination: true
    skip-domain:
        - Mijia Cloud
        - +.push.apple.com
# ---- TUN ----
tun:
    enable: true
    stack: gvisor
    auto-route: true
    strict-route: false
    auto-detect-interface: true
    dns-hijack:
        - any:53
    mtu: 1500
    auto-redirect: true
# ---- DNS ----
dns:
    enable: true
    ipv6: true
    use-system-hosts: false
    listen: 127.0.0.1:5335
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
